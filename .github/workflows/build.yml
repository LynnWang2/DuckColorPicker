name: build-desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: npm ci
      - run: npm test
      - name: Build and publish Windows bundle
        if: runner.os == 'Windows'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "取色鸭 v__VERSION__"
          releaseBody: |
            优化取色启动切换，减少 Windows 全屏闪烁和主窗口残影。
            修复取色显示与实际颜色不一致的问题，改进浅色中文颜色名。
            优化最近取色、复制格式、设置界面和托盘交互。

            macOS：Apple Silicon 与 Intel 通用版 DMG / App。
            Windows：NSIS 安装包。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Detect Apple signing configuration
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "configured=true" >> "$GITHUB_ENV"
          else
            echo "configured=false" >> "$GITHUB_ENV"
          fi

      - name: Build and publish signed macOS bundle
        if: runner.os == 'macOS' && env.configured == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: "取色鸭 v__VERSION__"
          releaseBody: |
            优化取色启动切换，减少 Windows 全屏闪烁和主窗口残影。
            修复取色显示与实际颜色不一致的问题，改进浅色中文颜色名。
            优化最近取色、复制格式、设置界面和托盘交互。

            macOS：Apple Silicon 与 Intel 通用版 DMG / App。
            Windows：NSIS 安装包。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build and publish unsigned macOS bundle
        if: runner.os == 'macOS' && env.configured != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "取色鸭 v__VERSION__"
          releaseBody: |
            优化取色启动切换，减少 Windows 全屏闪烁和主窗口残影。
            修复取色显示与实际颜色不一致的问题，改进浅色中文颜色名。
            优化最近取色、复制格式、设置界面和托盘交互。

            macOS：Apple Silicon 与 Intel 通用版 DMG / App。
            Windows：NSIS 安装包。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
