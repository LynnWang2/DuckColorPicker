name: build-desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: npm ci
      - run: npm test
      - name: Build and publish Windows bundle
        if: runner.os == 'Windows'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "取色鸭 v__VERSION__"
          releaseBody: |
            修复 Windows 主界面取色后窗口被隐藏的问题，改为最小化到任务栏。
            托盘启动取色时保留主窗口原有状态。
            修复屏幕复制弹幕沿用旧 HEX 内容的问题，使其匹配本次选择的复制格式和值。

            macOS：Apple Silicon 与 Intel 通用版 DMG / App。
            Windows：NSIS 安装包。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Detect Apple signing configuration
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "configured=true" >> "$GITHUB_ENV"
          else
            echo "configured=false" >> "$GITHUB_ENV"
          fi

      - name: Build and publish signed macOS bundle
        if: runner.os == 'macOS' && env.configured == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: "取色鸭 v__VERSION__"
          releaseBody: |
            修复 Windows 主界面取色后窗口被隐藏的问题，改为最小化到任务栏。
            托盘启动取色时保留主窗口原有状态。
            修复屏幕复制弹幕沿用旧 HEX 内容的问题，使其匹配本次选择的复制格式和值。

            macOS：Apple Silicon 与 Intel 通用版 DMG / App。
            Windows：NSIS 安装包。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build and publish unsigned macOS bundle
        if: runner.os == 'macOS' && env.configured != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "取色鸭 v__VERSION__"
          releaseBody: |
            修复 Windows 主界面取色后窗口被隐藏的问题，改为最小化到任务栏。
            托盘启动取色时保留主窗口原有状态。
            修复屏幕复制弹幕沿用旧 HEX 内容的问题，使其匹配本次选择的复制格式和值。

            macOS：Apple Silicon 与 Intel 通用版 DMG / App。
            Windows：NSIS 安装包。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Ad-hoc sign macOS app and refresh release assets
        if: runner.os == 'macOS' && env.configured != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BUNDLE_MACOS="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          APP="$BUNDLE_MACOS/DuckColorPicker.app"
          DMG="$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)"
          APPTAR="$(ls "$BUNDLE_MACOS"/*.app.tar.gz | head -1)"

          # Ad-hoc 签名：给二进制一个稳定的 cdhash 身份。
          # 完全未签名的应用在 TCC 里没有可锚定的身份，
          # 屏幕录制授权无法生效，CGPreflightScreenCaptureAccess() 会一直返回 false。
          codesign --force --deep --sign - "$APP"
          echo "---- codesign info ----"
          codesign -dv "$APP" 2>&1 | head -8
          codesign --verify --deep --strict "$APP" && echo "verify OK"

          # 把签名后的 .app 换进 DMG（保留原有的 Applications 快捷方式与布局）
          hdiutil convert "$DMG" -format UDRW -o /tmp/duck_rw.dmg
          VOL="$(hdiutil attach -nobrowse /tmp/duck_rw.dmg | grep -o '/Volumes/.*' | head -1)"
          rm -rf "$VOL/DuckColorPicker.app"
          ditto "$APP" "$VOL/DuckColorPicker.app"
          hdiutil detach "$VOL"
          hdiutil convert /tmp/duck_rw.dmg -format UDZO -o "$DMG.new"
          mv "$DMG.new" "$DMG"
          rm -f /tmp/duck_rw.dmg

          # 用签名后的 .app 重新打包 tar.gz
          rm -f "$APPTAR"
          tar -czf "$APPTAR" -C "$BUNDLE_MACOS" DuckColorPicker.app

          # 用签名后的产物覆盖 release 附件
          gh release upload "${GITHUB_REF_NAME}" "$DMG" "$APPTAR" --clobber
