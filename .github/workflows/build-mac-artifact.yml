name: build-mac-artifact

# 一次性 workflow：给最新 main 打 macOS 通用版 DMG，仅上传为 artifact，不发布 Release。用完即删。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - run: npm test
      - name: Build macOS universal bundle
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg
      - name: Ad-hoc sign app and repack DMG
        run: |
          set -euo pipefail
          BUNDLE_MACOS="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          APP="$BUNDLE_MACOS/DuckColorPicker.app"
          DMG="$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)"
          # Ad-hoc 签名：给二进制稳定的 cdhash 身份，否则 macOS 屏幕录制授权无法生效
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP" && echo "verify OK"
          # 把签名后的 .app 换进 DMG
          hdiutil convert "$DMG" -format UDRW -o /tmp/duck_rw.dmg
          VOL="$(hdiutil attach -nobrowse /tmp/duck_rw.dmg | grep -o '/Volumes/.*' | head -1)"
          rm -rf "$VOL/DuckColorPicker.app"
          ditto "$APP" "$VOL/DuckColorPicker.app"
          hdiutil detach "$VOL"
          hdiutil convert /tmp/duck_rw.dmg -format UDZO -o /tmp/duck_final.dmg
          mv /tmp/duck_final.dmg "$DMG"
          rm -f /tmp/duck_rw.dmg
          ls -la "$DMG"
      - uses: actions/upload-artifact@v4
        with:
          name: DuckColorPicker-mac-latest
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
