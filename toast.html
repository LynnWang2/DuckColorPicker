<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>
  html,body{margin:0;width:100%;height:100%;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
  body{display:grid;place-items:center}
  #message{background:rgba(35,35,39,.94);color:white;border-radius:12px;padding:11px 18px;font-size:13px;font-weight:600;white-space:nowrap}
</style></head>
<body><div id="message"></div><script>
  const params=new URLSearchParams(location.search);
  const format=params.get('format');
  document.querySelector('#message').textContent=/^(HEX|RGB|HSL|CMYK)$/.test(format||'')?`已复制 ${format} 色值`:'已复制色值';
</script></body>
</html>
