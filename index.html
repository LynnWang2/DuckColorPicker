<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>取色鸭</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <main class="app">
    <header class="titlebar" data-tauri-drag-region>
      <button id="about" class="about" aria-label="关于取色鸭">?</button>
    </header>
    <section class="brand">
      <img src="/icon.png" alt="取色鸭">
      <h1>取色鸭</h1>
      <p>Duck Color Picker</p>
    </section>
    <button id="pick" class="pick" type="button">
      <span class="pick-title">开始取色</span>
      <span class="pick-shortcut" id="shortcutLabel">Ctrl/Cmd Shift C</span>
    </button>
    <p class="sr-only" id="hint" role="status">快捷键可随时取色，Esc 取消</p>
    <section class="format-segments" aria-label="显示色值">
      <label><input type="checkbox" data-format="hex"><span>HEX</span></label>
      <label><input type="checkbox" data-format="rgb"><span>RGB</span></label>
      <label><input type="checkbox" data-format="hsl"><span>HSL</span></label>
      <label><input type="checkbox" data-format="cmyk"><span>CMYK</span></label>
    </section>
    <section class="card recent-card">
      <div class="section-heading">
        <div class="heading-with-count"><h2>最近取色</h2><span id="historyCount">0</span></div>
        <button id="clear" class="quiet-button" type="button">清空</button>
      </div>
      <div id="history" class="history" tabindex="0" aria-label="最近取色，可用鼠标滚轮或方向键查看更多颜色"></div>
    </section>
    <section class="card settings-card">
      <h2>取色设置</h2>
      <div class="setting-row">
        <svg class="setting-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="3" width="20" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M6 7h1m3 0h1m3 0h1m3 0h1M6 10h1m3 0h1m3 0h1m3 0h1M7 14h10M10 22l2 1 2-1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <label for="shortcut">快捷键</label>
        <input id="shortcut" readonly aria-label="取色快捷键">
      </div>
      <div class="setting-row">
        <svg class="setting-icon" viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor"/></svg>
        <label for="theme">软件外观</label>
        <select id="theme"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select>
      </div>
      <div class="setting-row">
        <svg class="setting-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="6" y="2" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/><rect x="2" y="6" width="16" height="16" rx="2" fill="var(--card)" stroke="currentColor" stroke-width="1.8"/><path d="M6 11h8M6 15h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <label for="copyFormat">取色后复制</label>
        <select id="copyFormat"><option value="hex">HEX（不含 #）</option><option value="hexwithhash">HEX（含 #）</option><option value="rgb">RGB</option><option value="hsl">HSL</option><option value="cmyk">CMYK</option></select>
      </div>
      <label class="setting-row startup-row">
        <svg class="setting-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2v10M6.1 5.8a9 9 0 1 0 11.8 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="startup-label">开机启动<small>开机后在托盘中运行</small></span>
        <input id="autoStart" type="checkbox">
        <i class="switch"></i>
      </label>
    </section>
  </main>
  <dialog id="aboutDialog">
    <button class="dialog-close" aria-label="关闭">×</button>
    <img src="/icon.png" alt="">
    <h2>取色鸭</h2>
    <p>简单、轻快的中文取色工具</p>
    <small>Version 2.0.10</small>
    <a class="project-link" href="https://github.com/LynnWang2/DuckColorPicker" target="_blank" rel="noopener noreferrer">GitHub 项目主页</a>
    <a class="social-link" href="https://xhslink.cn/o/HidvZgySfF" target="_blank" rel="noopener noreferrer">小红书主页</a>
  </dialog>
  <div id="toast" class="toast"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
